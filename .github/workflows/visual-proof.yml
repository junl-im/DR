name: Dungeon zero WebGL visual proof
on:
  pull_request:
    paths:
      - 'client/**'
      - 'scripts/armor-visual-smoke.cjs'
      - 'scripts/monster-live-smoke.cjs'
      - 'scripts/monster-retry-smoke.cjs'
      - 'scripts/mobile-review.cjs'
      - 'scripts/compact-hud-smoke.cjs'
      - 'scripts/unified-interface-smoke.cjs'
      - 'scripts/quest-hunt-smoke.cjs'
      - 'scripts/gameplay-polish-smoke.cjs'
      - 'scripts/combat-quest-smoke.cjs'
      - 'scripts/pr22-live-proof.cjs'
      - 'scripts/hud-town-smoke.cjs'
      - 'scripts/dungeon-input-smoke.cjs'
      - 'scripts/mobile-shell-smoke.cjs'
      - 'scripts/title-screen-smoke.cjs'
      - 'scripts/monster-respawn-smoke.cjs'
      - '.github/workflows/visual-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  webgl-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NX_DAEMON: 'false'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:firebase
      - run: npx playwright install --with-deps chromium
      - name: Start local Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4300 > /tmp/dungeon-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4300/art-lab.html >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/dungeon-preview.log
          exit 1
      - name: Verify PR22 visible feedback, real window toggles, scrollbar paint and three normal quests
        run: node scripts/pr22-live-proof.cjs
      - name: Verify live quest auto-walk, correct kills, HUD pulse/toggles and bounded zoom
        run: node scripts/gameplay-polish-smoke.cjs
      - name: Verify live quest reward, retaliation, skill continuity and character window
        run: node scripts/combat-quest-smoke.cjs
      - name: Prove compact HUD touch hold and inventory isolation
        run: node scripts/compact-hud-smoke.cjs
      - name: Capture WebGL armor proof
        run: node scripts/armor-visual-smoke.cjs
      - name: Prove live Firebase-root monster rigs (desktop and mobile)
        run: MONSTER_QA_VARIANT=firebase-root MONSTER_BASE_URL=http://127.0.0.1:4300/ node scripts/monster-live-smoke.cjs
      - name: Recover real GLB monster after an injected temporary HTTP 503 (desktop and mobile)
        run: MONSTER_BASE_URL=http://127.0.0.1:4300/ node scripts/monster-retry-smoke.cjs
      - name: Verify mobile touch controls at 320px, 390px and landscape
        run: node scripts/mobile-review.cjs
      - name: Verify quest target hunting, completion stop and reward persistence
        run: node scripts/quest-hunt-smoke.cjs
      - name: Verify HUD and portal body interaction
        run: node scripts/hud-town-smoke.cjs
      - name: Verify gate arrival dialog, nameplate and native mouse input restrictions
        run: node scripts/dungeon-input-smoke.cjs
      - name: Verify mobile back confirmation and save failure recovery
        run: node scripts/mobile-shell-smoke.cjs
      - name: Verify title layout, character selection and saved continuation
        run: node scripts/title-screen-smoke.cjs
      - name: Verify repeated monster respawns and living sibling opacity
        run: node scripts/monster-respawn-smoke.cjs
      - name: Verify fitted title, unified HUD and options at five viewport sizes
        run: node scripts/unified-interface-smoke.cjs
      - name: Rebuild GitHub Pages /DR/ production assets
        run: npm run build:github
      - name: Start built /DR/ Pages preview
        run: |
          npx vite preview --config client/vite.config.ts --base=/DR/ --host 127.0.0.1 --port 4301 > /tmp/dungeon-pages-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4301/DR/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/dungeon-pages-preview.log
          exit 1
      - name: Prove /DR/ model URLs and live monster meshes (desktop and mobile)
        run: MONSTER_QA_VARIANT=github-pages MONSTER_BASE_URL=http://127.0.0.1:4301/DR/ node scripts/monster-live-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-monster-retry-evidence
          path: artifacts/monster-retry-proof
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-monster-live-evidence
          path: artifacts/monster-visibility-proof
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-webgl-evidence
          path: artifacts/armor-visual-proof
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-mobile-touch-evidence
          path: artifacts/mobile-review-proof
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-gameplay-polish-evidence
          path: artifacts/gameplay-polish-proof
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-quest-hunt-evidence
          path: artifacts/quest-hunt-proof
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-dungeon-input-evidence
          path: artifacts/dungeon-input-proof
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-hud-town-evidence
          path: artifacts/hud-town-proof
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-mobile-shell-evidence
          path: artifacts/mobile-shell-proof
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-title-screen-evidence
          path: artifacts/title-screen-proof
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-monster-respawn-evidence
          path: artifacts/monster-respawn-proof
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-compact-hud-evidence
          path: artifacts/compact-hud-proof
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-unified-interface-evidence
          path: artifacts/unified-interface-proof
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-combat-quest-evidence
          path: artifacts/combat-quest-proof
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-zero-pr22-polish-evidence
          path: artifacts/pr22-polish-proof
          if-no-files-found: warn
